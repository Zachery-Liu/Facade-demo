name: Validate Facade chained Pages publishing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facade-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
      - name: Create and publish a complete release
        run: |
          printf 'Facade chained Linux release asset\n' > FacadeDemo-5.0.0-linux-x64.tar.gz
          printf 'Facade chained macOS release asset\n' > FacadeDemo-5.0.0-macos-arm64.dmg
          printf 'Facade chained Windows release asset\n' > FacadeDemo-5.0.0-windows-x64.exe
          gh release create v5.0.0 FacadeDemo-5.0.0-linux-x64.tar.gz FacadeDemo-5.0.0-macos-arm64.dmg FacadeDemo-5.0.0-windows-x64.exe --title 'Facade demo v5.0.0' --notes 'T05b chained workflow validation with complete platform assets.'
        env:
          GH_TOKEN: ${{ github.token }}

  facade:
    needs: release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the site configuration branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build after all release assets exist
        id: facade
        uses: Zachery-Liu/Facade@661b07efabd99d8ab76ea0dfc20ef9dea2536f9f
        with:
          config: .github/facade.yml
          base-path: ${{ steps.pages.outputs.base_path || '/' }}
          out-dir: .facade-dist
          token: ${{ github.token }}
      - name: Upload the complete Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.facade.outputs.output-path }}

  deploy:
    needs: facade
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
